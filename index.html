<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#060c18;--card:#0d1525;--card2:#111d33;--border:#1a2e50;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--purple:#a78bfa;--cyan:#22d3ee;--text:#e2e8f0;--muted:#64748b;--muted2:rgba(255,255,255,.65)}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

header{background:linear-gradient(135deg,#0a1628,#0d1f3c);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;flex-wrap:wrap;}
.logo{font-size:20px;font-weight:800;color:var(--blue);display:flex;align-items:center;gap:8px;white-space:nowrap;}
.header-sub{color:var(--muted);font-size:12px;flex:1;}
.sources{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:10px;color:var(--muted);}
.src-b{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;border:1px solid;}
.src-on{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3);color:#10b981;}
.badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid;}
.badge-live{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#ef4444;animation:pulse 2s infinite;}
.badge-ok{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:#10b981;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}

main{max-width:1440px;margin:0 auto;padding:16px 20px;}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.btn{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;transition:all .2s;white-space:nowrap;}
.btn:hover{transform:translateY(-1px);}
.btn-scan{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-size:14px;padding:10px 24px;}
.btn-scan:hover{background:linear-gradient(135deg,#2563eb,#1d4ed8);} 
.btn-scan:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-sec{background:var(--card2);border:1px solid var(--border);color:var(--muted2);padding:7px 14px;font-size:12px;}
.btn-sec:hover{border-color:var(--blue);color:var(--blue);} 
.btn-sec.active{border-color:var(--blue);color:var(--blue);background:rgba(59,130,246,.08);} 
.btn-sm{padding:5px 12px;font-size:11px;}

.progress-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:14px;display:none;}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:3px;transition:width .3s;width:0%;}
.progress-stats{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.progress-stats span{color:var(--text);font-weight:700;}
#apiStatus{font-size:11px;color:var(--muted);margin-top:6px;}

/* rest of original styles unchanged... */
</style>
